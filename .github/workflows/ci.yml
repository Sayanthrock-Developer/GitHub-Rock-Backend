name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate repository files
        shell: bash
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          test -s .env.example
          [[ -f .env ]] || cp .env.example .env
          docker compose config --quiet
          test -s LICENSE
          test -s web/index.html
      - name: Build and test backend
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain clean test buildFatJar 2>&1 | tee gradle-build.log
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Upload server JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: github-rock-backend
          path: build/libs/github-rock-backend.jar
          if-no-files-found: error
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build container
        run: docker build -t github-rock-backend:ci .
